name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run, so the latest
# commit is always the one verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same gate the pre-commit hook runs, so a contributor who bypassed
      # hooks locally cannot land a commit that only passes on their machine.
      - name: Verify
        run: npm run verify

      - name: Confirm the working tree is clean
        run: git diff --exit-code

  db:
    name: Database invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Postgres, because the claim being tested is that the database
    # refuses bad data. A test double cannot make that claim, and the product's
    # core rules live in constraints and triggers rather than in TypeScript.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ajo
          POSTGRES_PASSWORD: ajo
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # How the migration scripts find Postgres. Without these they fall back to
      # `sudo -u postgres`, which cannot work against a service container.
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ajo
      PGPASSWORD: ajo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Builds a database from the migration files alone and asserts the
      # product rules against it: 5 to 20 members, the creator inside the
      # member count, the draft-exit floor, seeded reference data, and a ledger
      # that is balanced and append-only.
      - name: Test schema invariants
        run: python scripts/test_migrations.py

  api:
    name: API against a real database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Postgres and Redis, because the API's two load-bearing claims are made to
    # the database and to Redis. Postgres is where the rules live (RLS, the audit
    # trigger, the token table), and Redis is the only thing bounding the signup
    # write path. A mocked either one would test the mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ajo
          POSTGRES_PASSWORD: ajo
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: ajo
      PGPASSWORD: ajo
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Builds `ajo_api_test` from the migration files, bootstraps the three
      # roles, compiles the API, and runs the integration suite as `ajo_api` --
      # NOSUPERUSER and NOBYPASSRLS -- so the RLS assertions are not vacuous.
      # `--no-redis` is deliberately not passed: with the service above, the
      # rate-limit cases run, and skipping them would leave the signup write
      # path's only bound unverified.
      - name: Run the API test suite
        run: python scripts/test_api.py

  spec:
    name: Specification structure
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install specification dependencies
        run: pip install python-docx

      - name: Build the specification
        run: python docs/src/build_spec.py

      # Verifies TOC, PAGE/NUMPAGES, header, footer tagline and updateFields.
      # A rebuild that silently drops a field would otherwise ship unnoticed.
      - name: Verify specification structure
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'docs/src')
          from build_spec import check
          raise SystemExit(check('AJO-ng-Complete-Product-Technical-Specification.docx'))
          "

      - name: Confirm the specification is current
        run: |
          if ! git diff --quiet -- \
            AJO-ng-Complete-Product-Technical-Specification.docx; then
            echo "The committed specification is stale. Rebuild and commit it:"
            echo "  python docs/src/build_spec.py"
            exit 1
          fi
